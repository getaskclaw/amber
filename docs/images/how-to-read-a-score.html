<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
:root{--pass:#1B7F79;--fail:#C0392B;--na:#78909C;--ink:#263238;--mut:#607D8B;--line:#CFD8DC}
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:"Noto Sans CJK SC","Noto Sans","Liberation Sans",sans-serif;color:var(--ink)}
#c{width:880px;padding:28px 32px 30px}
h1{font-size:30px;margin:0 0 20px;text-align:center}
.card{border:2px solid var(--line);border-radius:16px;padding:16px 22px;background:#F7F9FA}
.card h2{font-size:24px;margin:0 0 6px}.sub{font-size:21px;margin:2px 0}.mut{font-size:19px;color:var(--mut)}
.row{display:flex;gap:14px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}.g{font-weight:700;font-size:20px;min-width:96px}
.chip{display:inline-block;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;font-size:20px;margin:2px 4px 2px 0}
.arrow{text-align:center;color:var(--mut);font-size:34px;line-height:36px;margin:4px 0}
.three{display:flex;gap:14px}.o{flex:1;border-radius:14px;padding:14px 16px;border:2.5px solid}
.o b{display:block;font-size:30px;margin-bottom:4px}.o span{font-size:20px;line-height:1.35;display:block}
.o.p{background:#D8EFEC;border-color:var(--pass)}.o.p b{color:var(--pass)}
.o.f{background:#F8DDD9;border-color:var(--fail)}.o.f b{color:var(--fail)}
.o.n{background:#E8ECEF;border-color:var(--na)}.o.n b{color:#455A64}
.formula{font-size:30px;font-weight:700}
.ex{border-color:#F2A900;background:#FFF8E1}.eq{font-size:26px;font-weight:700;margin:8px 0}
.tag{display:inline-block;border-radius:10px;padding:2px 12px;color:#fff;margin:0 2px}
.tp{background:var(--pass)}.tf{background:var(--fail)}.tn{background:var(--na)}.big{font-size:40px;font-weight:800}
</style><body><div id="c"><h1>一份 AMBER 成绩单怎么读</h1>
<div class="card"><h2>① 一套题</h2><div class="sub">24 道实战任务，每道叫一「案」</div><div class="mut">分属 10 个「轴」（技能面）</div>
<div class="row"><span class="g">施工面</span><div><span class="chip">编码</span><span class="chip">交付</span><span class="chip">运维</span><span class="chip">需求</span><span class="chip">收敛</span></div></div>
<div class="row"><span class="g">判断面</span><div><span class="chip">UI</span><span class="chip">视觉</span><span class="chip">防御</span><span class="chip">归因</span><span class="chip">审查</span></div></div></div>
<div class="arrow">↓</div>
<div class="card" style="background:#fff"><h2>② 每案只有三种结果</h2><div class="three">
<div class="o p"><b>过</b><span>全部检查项通过</span></div>
<div class="o f"><b>没过</b><span>差一项也算没过（8/9 = 没过）</span></div>
<div class="o n"><b>NA</b><span>作废或暂停计分，不算过，也不算没过</span></div></div></div>
<div class="arrow">↓</div>
<div class="card"><h2>③ 总分</h2><div class="formula">过的案数 ÷ 24</div><div class="sub">有 NA 的，数字后加一撇 '</div><div class="mut">分母是这套题的案数（现在是 24），NA 不会让分母变小</div></div>
<div class="arrow">↓</div>
<div class="card ex"><h2>例：claude-sonnet-5-5</h2><div class="eq"><span class="tag tp">19 过</span> + <span class="tag tf">4 没过</span> + <span class="tag tn">1 NA</span> = 24</div>
<div class="sub">记作 <span class="big">19'/24</span></div></div></div></body></html>
